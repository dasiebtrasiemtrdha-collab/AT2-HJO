[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"
[project]
name = "at2hjo"
version = "4.0.2"
description = "Public AT2-HJO core accompanying revised manuscript 4.5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<2.3", "torch>=2.7,<2.8", "matplotlib>=3.10,<3.11"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "build>=1.2,<2", "scipy>=1.15,<1.16"]
[project.scripts]
at2hjo = "at2hjo.revision4.runner:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
